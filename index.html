<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>WWW</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Weners Wunderbare Wunschliste</h1>
    <div class="wishlist">
        <div class="left-side">
            <div class="left-content-container">
                <img src="pictures/2_pc-case.png" class="pc">
                <img src="pictures/price_star.svg" class="moin">
                <p>Silverstone FLP-02</p>
            </div>
            <div class="left-content-container">
                <img src="pictures/2_loop-earplugs.png" class="pc">
                <img src="pictures/price_star.svg" class="moin">
                <p>Loop Experience 2</p>
            </div>
            <div class="left-content-container">
                <img src="pictures/2_polaroid-round.png" class="polaroidRound">
                <img src="pictures/price_star.svg" class="moin">
            </div>
            <p>Polaroid 600 Film rund</p>
        </div>
        <div class="right-side">
            <div class="content-container">
                <img src="pictures/2_sony_kopfhörer.png" class="headphone">
                <img src="pictures/price_star.svg" class="moin2">
                <p>SONY WH-1000XM4C</p>
            </div>
            <div class="right-content-container">
                <img src="pictures/2_e-reader.png" class="reader">
                <img src="pictures/price_star.svg" class="moin2">
                <p>Pocketbook Verse Baby Blue</p>
            </div>
            <div class="right-content-container">
                <img src="pictures/2_polaroid.png" class="polaroid">
                <img src="pictures/price_star.svg" class="moin2">
                <p>Polaroid 600 Film</p>
            </div>
        </div>
    </div>
</body>
</html>
