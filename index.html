<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWW</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="heading">
        <h1>Werners Wunderbare Wunschliste</h1>
    </div>
    <div class="wishlist">
        <div class="left-side">
            <div class="blocker"></div>
            <div class="left-content-container">
                <img src="pictures/pictures_one-size/2_pc-case.png" class="img-l">
                <img src="pictures/price_star.svg" class="star-left">
                <p>Silverstone FLP-02</p>
            </div>
            <div class="left-content-container">
                <img src="pictures/pictures_one-size/2_loop-earplugs.png" class="img-l">
                <img src="pictures/price_star.svg" class="star-left">
                <p>Loop Experience 2</p>
            </div>
            <div class="left-content-container">
                <img src="pictures/pictures_one-size/2_polaroid-round.png" class="img-l">
                <img src="pictures/price_star.svg" class="star-left">
                <p>Polaroid 600 Film rund</p>
            </div>
        </div>
        <div class="right-side">
            <div class="right-content-container">
                <img src="pictures/pictures_one-size/2_sony_kopfhörer.png" class="img-r">
                <img src="pictures/price_star.svg" class="star-right">
                <p>SONY WH-1000XM4C</p>
            </div>
            <div class="right-content-container">
                <img src="pictures/pictures_one-size/2_e-reader.png" class="img-r">
                <img src="pictures/price_star.svg" class="star-right">
                <p>Pocketbook Verse<br> 
                    Baby Blue</p>
            </div>
            <div class="right-content-container">
                <img src="pictures/pictures_one-size/2_polaroid.png" class="img-r">
                <img src="pictures/price_star.svg" class="star-right">
                <p>Polaroid 600 Film</p>
            </div>
        </div>
    </div>
</body>
</html>
